<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ganaane — Coming Soon</title>
<meta name="description" content="Ganaane is on its way. Small roots, big systems. Sign up to be the first to know when we launch.">
<link rel="canonical" href="https://ganaane.com/">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#0F1310">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0F1310;
    --panel: #161C17;
    --line: #263029;
    --text: #EDEFEA;
    --muted: #8A9289;
    --gold: #D4A94A;
    --green: #7FE0A6;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html{ scroll-behavior: smooth; }

  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* growth canvas */
  #growth{
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    opacity: 0.55;
  }

  .wrap{
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6vh 6vw;
  }

  .eyebrow{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--green);
    display: inline-flex;
    align-items: center;
    gap: 0.6em;
    margin-bottom: 2.2rem;
  }

  .eyebrow::before{
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 0 0 rgba(127,224,166,0.6);
    animation: pulse 2.4s ease-out infinite;
  }

  @keyframes pulse{
    0%   { box-shadow: 0 0 0 0 rgba(127,224,166,0.55); }
    70%  { box-shadow: 0 0 0 9px rgba(127,224,166,0); }
    100% { box-shadow: 0 0 0 0 rgba(127,224,166,0); }
  }

  h1{
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 500;
    font-size: clamp(3rem, 11vw, 7rem);
    line-height: 0.98;
    letter-spacing: -0.01em;
    color: var(--text);
  }

  h1 span{
    color: var(--gold);
    font-style: italic;
    font-weight: 400;
  }

  .slogan{
    margin-top: 1.4rem;
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-style: italic;
    font-size: clamp(1.1rem, 2.4vw, 1.5rem);
    color: var(--muted);
    max-width: 34ch;
  }

  .divider{
    width: 1px;
    height: 48px;
    background: linear-gradient(var(--line), transparent);
    margin: 3rem 0 2.4rem;
  }

  form{
    display: flex;
    width: 100%;
    max-width: 420px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--panel);
    padding: 5px;
    transition: border-color 0.25s ease;
  }

  form:focus-within{
    border-color: var(--green);
  }

  input[type="email"]{
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 0.92rem;
    padding: 0.7rem 1.1rem;
  }

  input[type="email"]::placeholder{
    color: var(--muted);
  }

  button{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background: var(--green);
    color: #0F1310;
    border: none;
    border-radius: 999px;
    padding: 0 1.4rem;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.2s ease;
    white-space: nowrap;
  }

  button:hover{ background: var(--gold); transform: translateY(-1px); }
  button:active{ transform: translateY(0); }

  .note{
    margin-top: 1rem;
    font-size: 0.78rem;
    color: var(--muted);
    min-height: 1.2em;
  }

  footer{
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.6rem 6vw 2rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    border-top: 1px solid var(--line);
  }

  footer a{
    color: var(--muted);
    text-decoration: none;
    margin-left: 1.4rem;
    transition: color 0.2s ease;
  }

  footer a:hover{ color: var(--green); }

  .footer-links{ display: flex; }

  @media (max-width: 520px){
    footer{ flex-direction: column; gap: 0.8rem; text-align: center; }
    footer a{ margin: 0 0.6rem; }
  }

  @media (prefers-reduced-motion: reduce){
    .eyebrow::before{ animation: none; }
    #growth{ display: none; }
  }
</style>
</head>
<body>

<canvas id="growth"></canvas>

<main class="wrap">
  <span class="eyebrow">Status: Growing</span>
  <h1>Ganaane.com<span>.</span></h1>
  <p class="slogan">Small roots. Big systems.</p>

  <div class="divider"></div>

  <form id="notify-form">
    <input type="email" id="email" placeholder="you@email.com" required autocomplete="email">
    <button type="submit">Notify me</button>
  </form>
  <p class="note" id="note"></p>
</main>

<footer>
  <span>&copy; <span id="year"></span> Ganaane.com</span>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  // Email capture — static site, so we just confirm locally.
  // Swap this handler for a real endpoint (Formspree, Mailchimp, etc.) when ready.
  const form = document.getElementById('notify-form');
  const note = document.getElementById('note');
  form.addEventListener('submit', function(e){
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    if(email){
      note.textContent = "You're on the list. We'll be in touch.";
      form.reset();
    }
  });

  // Organic "growth" network — branches sprout outward from a root point
  // and settle into a quiet constellation. Respects reduced-motion.
  const canvas = document.getElementById('growth');
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if(!prefersReduced && canvas){
    const ctx = canvas.getContext('2d');
    let w, h, dpr;

    function resize(){
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = canvas.width = window.innerWidth * dpr;
      h = canvas.height = window.innerHeight * dpr;
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
    }
    resize();
    window.addEventListener('resize', resize);

    // Build a branching structure procedurally
    const nodes = [];
    const rootCount = 3;
    const maxDepth = 5;

    function grow(x, y, angle, depth, spread){
      if(depth > maxDepth) return;
      const len = (90 - depth * 12) * dpr * (0.6 + Math.random() * 0.5);
      const nx = x + Math.cos(angle) * len;
      const ny = y + Math.sin(angle) * len;
      nodes.push({ x1: x, y1: y, x2: nx, y2: ny, depth, born: Math.random() * 1.4 });

      const branches = depth < 2 ? 2 : (Math.random() > 0.5 ? 2 : 1);
      for(let i = 0; i < branches; i++){
        const a = angle + (Math.random() - 0.5) * spread;
        grow(nx, ny, a, depth + 1, spread * 0.92);
      }
    }

    for(let i = 0; i < rootCount; i++){
      const startX = w * (0.2 + Math.random() * 0.6);
      const startY = h * (0.3 + Math.random() * 0.5);
      const baseAngle = Math.random() * Math.PI * 2;
      grow(startX, startY, baseAngle, 0, 1.1);
    }

    let start = null;
    const totalDuration = 2600;

    function draw(ts){
      if(!start) start = ts;
      const elapsed = ts - start;
      ctx.clearRect(0, 0, w, h);

      nodes.forEach(n => {
        const nodeStart = n.born * 900;
        const progress = Math.max(0, Math.min(1, (elapsed - nodeStart) / 700));
        if(progress <= 0) return;

        const cx = n.x1 + (n.x2 - n.x1) * progress;
        const cy = n.y1 + (n.y2 - n.y1) * progress;

        const alpha = 0.16 - n.depth * 0.02;
        ctx.strokeStyle = `rgba(127, 224, 166, ${Math.max(alpha, 0.03)})`;
        ctx.lineWidth = Math.max(1.4 - n.depth * 0.18, 0.4) * dpr;
        ctx.beginPath();
        ctx.moveTo(n.x1, n.y1);
        ctx.lineTo(cx, cy);
        ctx.stroke();

        if(progress >= 1 && n.depth >= 3){
          ctx.fillStyle = `rgba(212, 169, 74, ${0.5 - n.depth * 0.06})`;
          ctx.beginPath();
          ctx.arc(n.x2, n.y2, 1.6 * dpr, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      if(elapsed < totalDuration + 700){
        requestAnimationFrame(draw);
      }
    }
    requestAnimationFrame(draw);
  }
</script>

</body>
</html>
